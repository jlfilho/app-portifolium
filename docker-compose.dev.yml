services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: portifolium-frontend:local
    container_name: portifolium-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: e2e
    image: portifolium-e2e:local
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend
    volumes:
      - ./frontend/playwright-report:/app/playwright-report
      - ./frontend/test-results:/app/test-results
    depends_on:
      frontend:
        condition: service_healthy
    profiles:
      - e2e

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: portifolium-api:local
    container_name: portifolium-api
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgresql,jwt
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-portifolium}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-always}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-3600000}
      APP_SEED_ADMIN_ENABLED: ${APP_SEED_ADMIN_ENABLED:-true}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL:-admin@uea.edu.br}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-admin123}
      APP_SEED_ADMIN_RESET_PASSWORD: ${APP_SEED_ADMIN_RESET_PASSWORD:-true}
      APP_CORS_ALLOWED_ORIGINS: ${DEV_APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      FRONTEND_URL: ${DEV_FRONTEND_URL:-http://localhost:4200}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: false
      FILE_STORAGE_LOCATION: /var/lib/portifolium/files
    volumes:
      - ./portifolium-files:/var/lib/portifolium/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: portifolium-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portifolium}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portifolium}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
